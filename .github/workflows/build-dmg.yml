name: Build and release dmg

on:
  push:
    tags:
      - "*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Build and sign app
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if xcodebuild -project cmdX.xcodeproj \
              -scheme cmdX \
              -configuration Release \
              -derivedDataPath build \
              -destination "generic/platform=macOS" \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS="arm64 x86_64" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Development" \
              DEVELOPMENT_TEAM=K2G932QL79 \
              build; then
              exit 0
            fi
            killall -9 XCBBuildService actool AssetCatalogAgent ibtoold 2>/dev/null || true
            rm -rf build
            sleep 5
          done
          exit 1

      - name: Verify universal binary and signature
        run: |
          BIN_PATH="build/Build/Products/Release/cmdX.app/Contents/MacOS/cmdX"
          lipo -info "$BIN_PATH"
          codesign --verify --deep --strict --verbose=2 "build/Build/Products/Release/cmdX.app"
          codesign -dv "build/Build/Products/Release/cmdX.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package dmg
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="build/Build/Products/Release/cmdX.app"
          DMG_NAME="cmdX-${VERSION}.dmg"
          rm -f "$DMG_NAME"
          create-dmg \
            --volname "cmdX" \
            --window-pos 200 120 \
            --window-size 660 420 \
            --icon-size 160 \
            --icon "cmdX.app" 170 200 \
            --hide-extension "cmdX.app" \
            --app-drop-link 490 200 \
            "$DMG_NAME" \
            "$APP_PATH" || true
          if [ ! -f "$DMG_NAME" ]; then
            STAGE_DIR="dmg-stage"
            rm -rf "$STAGE_DIR"
            mkdir -p "$STAGE_DIR"
            cp -R "$APP_PATH" "$STAGE_DIR/"
            ln -s /Applications "$STAGE_DIR/Applications"
            hdiutil create -volname "cmdX" -srcfolder "$STAGE_DIR" -ov -format UDZO "$DMG_NAME"
          fi
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or update release with dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.package.outputs.dmg_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$DMG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.package.outputs.dmg_name }}
        run: |
          SHA=$(shasum -a 256 "$DMG" | cut -d ' ' -f1)

          git fetch origin main
          git checkout main

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/cmdx.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/cmdx.rb

          if git diff --quiet Casks/cmdx.rb; then
            echo "Cask already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/cmdx.rb
          git commit -m "chore: bump Homebrew cask to ${VERSION}"
          git push origin HEAD:main
